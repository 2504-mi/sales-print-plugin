<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>销售单打印</title><style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f5f5f5;padding:12px}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.toolbar button{padding:7px 14px;font-size:13px;border:none;border-radius:4px;cursor:pointer;background:#2b6cf6;color:#fff}
.toolbar button.sec{background:#e8e8e8;color:#333}
.toolbar button.green{background:#16b777;color:#fff}
.toolbar button.red{background:#e54545;color:#fff}
.doc{background:#fff;padding:24px 20px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,0.1);font-size:12px;max-width:900px;margin:0 auto}
.doc-title{text-align:center;font-size:22px;font-weight:bold;letter-spacing:8px;margin-bottom:4px}
.doc-sub{text-align:center;font-size:11px;color:#999;margin-bottom:12px}
.doc-line{height:2px;background:#333;margin-bottom:14px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;margin-bottom:14px;font-size:13px;line-height:2}
.info-item{display:flex}
.info-item .il{color:#666;white-space:nowrap;min-width:70px}
.info-item .iv{flex:1;border-bottom:1px solid #ddd;padding:0 4px}
table{width:100%;border-collapse:collapse;margin-bottom:14px}
th{background:#f0f0f0;border:1px solid #333;padding:5px 3px;font-size:12px;font-weight:bold;text-align:center}
td{border:1px solid #333;padding:4px 3px;font-size:12px}
table.slim th,table.slim td{padding:3px 2px;font-size:11px}
.total-section{text-align:right;font-size:13px;line-height:2;margin-bottom:10px}
.total-section .cn{color:#d4380d;font-weight:bold;margin-right:12px}
.sign-section{display:flex;justify-content:space-between;margin-top:20px;padding-top:10px;flex-wrap:wrap}
.sign-item{text-align:center;min-width:120px;padding-top:12px;border-top:1px solid #333;margin:8px 4px;font-size:13px}
@media print{body{background:#fff;padding:0}.toolbar{display:none!important}.doc{box-shadow:none;margin:0;padding:20px}table{page-break-inside:auto}tr{page-break-inside:avoid}}
.tips{text-align:center;padding:40px 20px;color:#666}
.tips h3{margin-bottom:12px;color:#333}
.error{color:#e54545;background:#fff0f0;padding:10px;border-radius:4px;font-size:12px;margin-top:10px}
#debug{background:#f5f5f5;border:1px solid #ddd;margin-top:8px;padding:6px;font-size:10px;white-space:pre-wrap;max-height:120px;overflow:auto;border-radius:4px}</style><script>/*! For license information please see bundle.js.LICENSE.txt */
