<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>销售出库单打印</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei","PingFang SC",sans-serif; background: #f5f5f5; padding: 12px; }
    .print-btn { width:100%; padding:10px; font-size:15px; background:#2b6cf6; color:#fff; border:none; border-radius:4px; cursor:pointer; margin-bottom:12px; }
    .print-btn:hover { background:#1a5ce5; }
    .doc { background:#fff; padding:20px 16px; border-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,0.1); font-size:12px; }
    .title { text-align:center; font-size:20px; font-weight:bold; letter-spacing:6px; margin-bottom:16px; padding-bottom:8px; border-bottom:2px solid #333; }
    .header { margin-bottom:14px; font-size:13px; line-height:2; }
    .header .row { display:flex; justify-content:space-between; }
    table { width:100%; border-collapse:collapse; margin-bottom:14px; }
    th { background:#f0f0f0; border:1px solid #333; padding:5px 3px; font-size:12px; font-weight:bold; text-align:center; }
    td { border:1px solid #333; padding:4px 3px; font-size:12px; }
    .tc { text-align:center; }
    .tr { text-align:right; }
    .footer { margin-bottom:16px; font-size:13px; line-height:2; }
    .footer .row { display:flex; align-items:baseline; flex-wrap:wrap; }
    .label { font-weight:bold; white-space:nowrap; }
    .money-cn { color:#d4380d; font-weight:bold; margin:0 4px; }
    .money-num { color:#666; }
    .sign { display:flex; justify-content:space-around; margin-top:20px; padding-top:20px; border-top:1px dashed #ccc; }
    .sign-item { font-size:13px; text-align:center; min-width:72px; padding-top:16px; border-top:1px solid #333; }
    .tips { text-align:center; padding:40px 20px; color:#666; }
    .tips h3 { margin-bottom:12px; color:#333; }
    .error { color:#e54545; margin-top:8px; font-size:12px; background:#fff0f0; padding:10px; border-radius:4px; text-align:left; white-space:pre-wrap; }
    .debug { font-size:11px; color:#999; margin-top:10px; text-align:left; white-space:pre-wrap; background:#f8f8f8; padding:8px; border-radius:4px; max-height:200px; overflow:auto; }
    @media print {
      body { background:#fff; padding:0; }
      .print-btn { display:none !important; }
      .doc { box-shadow:none; }
    }
  </style>
</head>
<body>
  <button class="print-btn" onclick="window.print()">🖨️ 打印出库单</button>
  <div id="app" class="tips"><h3>📋 销售出库单打印</h3><p>初始化中...</p></div>

  <script type="importmap">
  {
    "imports": {
      "@lark-base-open/js-sdk": "https://unpkg.com/@lark-base-open/js-sdk@1.0.2/dist/index.mjs"
    }
  }
  </script>

  <script type="module">
  import { bitable } from "@lark-base-open/js-sdk";

  const app = document.getElementById('app');
  const logs = [];

  function log(msg) {
    logs.push(msg);
    console.log(msg);
  }

  function showUI(data) {
    const trs = data.details.map((x, i) => 
      `<tr><td class="tc">${i+1}</td><td>${x.name}</td><td>${x.spec}</td><td class="tc">${x.unit}</td><td class="tr">${x.qty}</td><td class="tr">¥${x.price.toFixed(2)}</td><td class="tr">¥${x.amount.toFixed(2)}</td></tr>`
    ).join('');

    const empty = data.details.length === 0 ? '<tr><td colspan="7" style="padding:8px;text-align:center;color:#999">暂无商品明细</td></tr>' : '';

    app.innerHTML = `
      <div class="doc">
        <div class="title">出 库 单</div>
        <div class="header">
          <div class="row"><span>购货单位：${data.customer}</span><span>日期：${data.date}</span></div>
          <div class="row"><span>单据编号：${data.billNo}</span><span>经手人：${data.handler}</span></div>
        </div>
        <table>
          <thead><tr><th>序号</th><th>商品名称</th><th>规格型号</th><th>单位</th><th>数量</th><th>单价</th><th>金额</th></tr></thead>
          <tbody>${trs || empty}</tbody>
        </table>
        <div class="footer">
          <div class="row"><span class="label">金额合计（大写）：</span><span class="money-cn">${data.totalCn}</span><span class="money-num">（¥${data.total.toFixed(2)}）</span></div>
          ${data.remark ? '<div class="row"><span class="label">备注：</span><span>' + data.remark + '</span></div>' : ''}
        </div>
        <div class="sign">
          <div class="sign-item">经手人：${data.handler}</div>
          <div class="sign-item">保管：</div>
          <div class="sign-item">会计：</div>
          <div class="sign-item">出纳：</div>
        </div>
      </div>
    `;
  }

  async function getRecordIdList(table) {
    // 尝试各种方式获取记录列表
    try {
      // 方法1: getRecordIdList (新版)
      if (table.getRecordIdList) {
        const ids = await table.getRecordIdList();
        if (ids && ids.length > 0) return ids;
      }
    } catch(e) { log('getRecordIdList失败: ' + e.message); }
    
    try {
      // 方法2: getRecordList
      if (table.getRecordList) {
        const list = await table.getRecordList();
        if (list && list.length > 0) return list.map(r => r.id || r.recordId || r);
      }
    } catch(e) { log('getRecordList失败: ' + e.message); }
    
    try {
      // 方法3: 遍历迭代器
      const ids = [];
      for await (const r of table) {
        ids.push(r.id || r.recordId || '');
        if (ids.length > 200) break;
      }
      if (ids.length > 0) return ids;
    } catch(e) { log('迭代器失败: ' + e.message); }
    
    return [];
  }

  async function main() {
    try {
      log('SDK已加载');
      
      let table, recordId;
      
      // 先尝试getSelection
      let sel;
      try {
        sel = await bitable.base.getSelection();
        log('getSelection: ' + JSON.stringify(sel));
      } catch(e) {
        log('getSelection错误: ' + e.message);
      }

      // 直接通过表名找表
      try {
        table = await bitable.base.getTableByName('出库单');
        log('通过表名获取表: ' + (table ? '成功' : 'null'));
      } catch(e) {
        log('getTableByName失败: ' + e.message);
      }
      
      if (!table) {
        try {
          table = await bitable.base.getTableById('tblUbiw8UKMY0cHI');
          log('通过ID获取表: 成功');
        } catch(e) {
          log('getTableById失败: ' + e.message);
        }
      }

      if (!table) {
        app.innerHTML = '<div class="tips"><h3>📋 出错了</h3><div class="error">找不到"出库单"表</div><div class="debug">' + logs.join('\n') + '</div></div>';
        return;
      }

      const meta = await table.getMeta();
      log('当前表: ' + meta.name);

      // 优先用选中的记录ID
      if (sel && sel.recordId) {
        recordId = sel.recordId;
        log('使用选中记录: ' + recordId);
      } else {
        // 否则取第一条
        log('无选中记录，取第一条');
        const ids = await getRecordIdList(table);
        log('记录列表: ' + JSON.stringify(ids));
        if (ids && ids.length > 0) {
          recordId = ids[0];
        }
      }

      if (sel && sel.tableId) {
        const curTable = await bitable.base.getTableById(sel.tableId);
        const curMeta = await curTable.getMeta();
        log('选中表: ' + curMeta.name);
      }

      if (!table || !recordId) {
        app.innerHTML = '<div class="tips"><h3>📋 销售出库单打印</h3><p>请先在出库单表中添加数据</p><div class="debug">' + logs.join('\n') + '</div></div>';
        return;
      }

      log('准备读取记录: ' + recordId);
      
      // 获取字段列表
      const metaList = await table.getFieldMetaList();
      const fId = {};
      metaList.forEach(f => { fId[f.name] = f.id; });
      log('字段映射: ' + JSON.stringify(fId));

      // 获取记录
      const rec = await table.getRecordById(recordId);
      log('记录数据: ' + (rec ? JSON.stringify(Object.keys(rec)) : 'null'));

      if (!rec) {
        app.innerHTML = '<div class="tips"><h3>📋 出错了</h3><p>无法读取记录</p><div class="debug">' + logs.join('\n') + '</div></div>';
        return;
      }

      const fields = rec.fields || rec;
      log('fields key: ' + JSON.stringify(Object.keys(fields)));

      const gf = (name) => {
        const id = fId[name];
        const v = id && fields[id] !== undefined ? fields[id] : fields[name];
        return v !== undefined && v !== null ? v : null;
      };

      // 日期
      let dateStr = '';
      const dv = gf('日期');
      if (dv) {
        const d = new Date(Number(dv));
        if (!isNaN(d.getTime())) {
          dateStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        } else {
          dateStr = String(dv);
        }
      }

      const data = {
        billNo: String(gf('单据编号') || ''),
        date: dateStr,
        customer: String(gf('购货单位') || ''),
        handler: String(gf('经手人') || ''),
        remark: String(gf('备注') || ''),
        details: [],
        total: 0,
        totalCn: ''
      };

      log('主表数据: ' + JSON.stringify({billNo: data.billNo, customer: data.customer}));

      // 关联明细
      const dl = gf('出库明细');
      log('关联明细原始值: ' + JSON.stringify(dl));

      if (dl) {
        let rids = [];
        if (Array.isArray(dl)) {
          dl.forEach(v => {
            if (typeof v === 'string') rids.push(v);
            else if (v && v.record_id) rids.push(v.record_id);
            else if (v && v.id) rids.push(v.id);
            else if (v && typeof v === 'object') rids.push(String(v));
          });
        } else if (typeof dl === 'object') {
          if (dl.record_id) rids = [dl.record_id];
          else if (dl.id) rids = [dl.id];
        }

        log('解析出的rids: ' + JSON.stringify(rids));

        if (rids.length > 0) {
          const dt = await bitable.base.getTableByName('出库明细');
          if (!dt) {
            log('无法找到出库明细表');
          } else {
            const dm = await dt.getFieldMetaList();
            const dId = {};
            dm.forEach(f => { dId[f.name] = f.id; });
            
            for (const rid of rids) {
              try {
                const dr = await dt.getRecordById(rid);
                if (dr) {
                  const df = dr.fields || dr;
                  const dgf = (n) => {
                    const id = dId[n];
                    const v = id && df[id] !== undefined ? df[id] : df[n];
                    return v !== undefined && v !== null ? v : null;
                  };
                  data.details.push({
                    name: String(dgf('商品名称') || ''),
                    spec: String(dgf('规格型号') || ''),
                    unit: String(dgf('单位') || ''),
                    qty: Number(dgf('数量') || 0),
                    price: Number(dgf('单价') || 0),
                    amount: Number(dgf('金额') || 0),
                  });
                }
              } catch(e) {
                log('读取明细 ' + rid + ' 出错: ' + e.message);
              }
            }
          }
        }
      }

      data.total = data.details.reduce((s, x) => s + x.amount, 0);

      // 金额转大写
      const dt = ['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'];
      const u = ['','拾','佰','仟','万'];
      const toCN = (num) => {
        if (num === 0) return '零元整';
        const ip = Math.floor(num);
        const dp = Math.round((num - ip) * 100);
        let r = '';
        const s = ip.toString();
        for (let i = 0; i < s.length; i++) {
          const n = parseInt(s[i]);
          const p = s.length - 1 - i;
          if (n === 0) {
            if (p % 4 === 0 && p > 0) r += u[p];
            else if (i > 0 && parseInt(s[i-1]) !== 0) r += '零';
          } else {
            r += dt[n] + (p % 4 === 0 && p > 0 ? u[p] : (p === 0 ? '' : u[p % 4]));
          }
        }
        r += '元';
        if (dp === 0) r += '整';
        else {
          const j = Math.floor(dp / 10);
          const f = dp % 10;
          if (j > 0) r += dt[j] + '角';
          else if (f > 0) r += '零';
          if (f > 0) r += dt[f] + '分';
        }
        return r;
      };
      data.totalCn = toCN(data.total);

      log('加载完成，明细数: ' + data.details.length);
      showUI(data);
      
    } catch(e) {
      app.innerHTML = '<div class="tips"><h3>📋 出错了</h3><div class="error">' + e.stack + '</div></div>';
    }
  }

  main();

  // 监听变化
  try {
    bitable.base.onSelectionChange(() => main());
    bitable.base.onRecordChange(() => main());
  } catch(e) {
    log('监听事件失败: ' + e.message);
  }
  </script>
</body>
</html>
